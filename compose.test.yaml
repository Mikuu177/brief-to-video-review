name: brief-review-tests
services:
  db:
    image: postgres:15.13-bookworm
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: review_test_only
      POSTGRES_DB: creator_review_test
    ports:
      - 127.0.0.1:55433:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U creator -d creator_review_test]
      interval: 2s
      retries: 30
  redis:
    image: redis:7.2-bookworm
    ports:
      - 127.0.0.1:56380:6379
